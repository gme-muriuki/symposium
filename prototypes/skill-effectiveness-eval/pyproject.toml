[project]
name = "symposium-skill-effectiveness-prototype"
version = "0.0.0"
description = "Disposable Inspect AI framework-fit spike"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.115.0,<1",
    "inspect-ai==0.3.252",
    "inspect-swe==0.2.67",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short"]
pythonpath = ["."]
